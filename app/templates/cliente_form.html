{% extends "base.html" %}
{% block conteudo %}
<h1>{{ "Editar " ~ c.nome if c else "Novo cliente" }}</h1>
<p class="sub">Os campos de vínculo (telefone, grupo, canal do Slack, código Sponte) ligam as mensagens e o financeiro a este cliente.</p>
<div class="card">
<form class="campos" method="post" action="/clientes/salvar">
  {% if c %}<input type="hidden" name="id" value="{{ c.id }}">{% endif %}
  <label>Nome * <input name="nome" required value="{{ c.nome if c else '' }}"></label>
  <label>Empresa <input name="empresa" value="{{ c.empresa or '' if c else '' }}"></label>
  <label>Programa <input name="programa" list="programas" value="{{ c.programa or '' if c else '' }}"></label>
  <datalist id="programas"><option>PEP</option><option>MESP</option><option>Potencialize</option><option>PTZ</option><option>LEAP²</option><option>Nível X</option><option>Plenitude</option><option>In Company</option></datalist>
  <label>Responsável CS <input name="responsavel_cs" value="{{ c.responsavel_cs or '' if c else '' }}"></label>
  <label>WhatsApp (com DDD) <input name="telefone" placeholder="11 98765-4321" value="{{ c.telefone or '' if c else '' }}"></label>
  <label>ID do grupo de WhatsApp <input name="whatsapp_grupo_id" placeholder="1203...@g.us" value="{{ c.whatsapp_grupo_id or '' if c else '' }}"></label>
  <label>ID do canal no Slack <input name="slack_channel_id" placeholder="C0123ABCD" value="{{ c.slack_channel_id or '' if c else '' }}"></label>
  <label>Código no Sponte <input name="sponte_id" value="{{ c.sponte_id or '' if c else '' }}"></label>
  <label>Valor mensal (R$) <input name="valor_mensal" inputmode="decimal" value="{{ ('%.2f'|format(c.valor_mensal)).replace('.', ',') if c and c.valor_mensal else '' }}"></label>
  <label>Início <input type="date" name="data_inicio" value="{{ c.data_inicio or '' if c else '' }}"></label>
  <label>Renovação <input type="date" name="data_renovacao" value="{{ c.data_renovacao or '' if c else '' }}"></label>
  <label>Progresso no programa (0–100) <input type="number" min="0" max="100" name="progresso" value="{{ c.progresso if c and c.progresso is not none else '' }}"></label>
  <label>Status
    <select name="status">{% for s in ["ativo", "pausado", "cancelado"] %}<option {{ "selected" if c and c.status == s }}>{{ s }}</option>{% endfor %}</select>
  </label>
  <div class="inteiro"><button class="btn">Salvar</button></div>
</form>
</div>
{% endblock %}
