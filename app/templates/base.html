<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Sucesso do Cliente{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --texto: #1d2330; --suave: #687082; --borda: #e3e6ec;
    --marca: #2d5bd7; --ok: #1f8a4c; --ok-bg: #e5f5ec; --at: #a86400; --at-bg: #fff2dc;
    --risco: #c0362c; --risco-bg: #fde8e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --texto: #e7e9ee; --suave: #9aa1b0; --borda: #2c323d;
      --marca: #7b9cff; --ok: #5fd08f; --ok-bg: #173323; --at: #f0b55a; --at-bg: #3a2b12;
      --risco: #ff8a80; --risco-bg: #3d1a17;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--texto); }
  header { background: var(--card); border-bottom: 1px solid var(--borda); padding: 12px 16px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  header strong { font-size: 17px; }
  header a { color: var(--suave); text-decoration: none; }
  header a:hover { color: var(--texto); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 28px 0 10px; }
  .sub { color: var(--suave); margin: 0 0 16px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: 10px; padding: 14px 16px; }
  .kpi .rotulo { color: var(--suave); font-size: 13px; }
  .kpi .valor { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); font-weight: 600; }
  td.num, th.num { font-variant-numeric: tabular-nums; text-align: right; }
  tr:last-child td { border-bottom: 0; }
  .rolagem { overflow-x: auto; }
  a { color: var(--marca); }
  .selo { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .saudavel { background: var(--ok-bg); color: var(--ok); }
  .atencao { background: var(--at-bg); color: var(--at); }
  .risco { background: var(--risco-bg); color: var(--risco); }
  .alertas { margin: 0; padding-left: 18px; color: var(--suave); font-size: 13px; }
  .barra { height: 6px; background: var(--borda); border-radius: 3px; overflow: hidden; min-width: 60px; }
  .barra > span { display: block; height: 100%; background: var(--marca); }
  .btn { display: inline-block; background: var(--marca); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; text-decoration: none; }
  .btn.sec { background: transparent; color: var(--marca); border: 1px solid var(--borda); }
  form.campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--suave); }
  input, select, textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--borda); border-radius: 7px; background: var(--card); color: var(--texto); }
  textarea { min-height: 90px; }
  .inteiro { grid-column: 1 / -1; }
  .msg { font-size: 14px; }
  .msg .meta { color: var(--suave); font-size: 12px; }
  .vazio { color: var(--suave); padding: 16px; text-align: center; }
  .linha { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; margin-bottom: 12px; }
</style>
</head>
<body>
<header>
  <strong>Sucesso do Cliente</strong>
  <a href="/">Carteira</a>
  <a href="/pendentes">Contatos sem cliente</a>
  <a href="/clientes/novo">Novo cliente</a>
</header>
<main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
